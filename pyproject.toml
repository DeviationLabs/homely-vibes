[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "homely_vibes"
version = "2.0.0"
description = "Home automation and monitoring system"
authors = [{name = "Amit Butala", email = "abutala@deviationlabs.com"}]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "requests>=2.33.0",
    "openai>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "langchain>=1.3.9",
    "langchain-openai>=1.1.14",
    "tiktoken>=0.8.0",
    "tqdm>=4.66.0",
    "tenacity>=8.0.0",
    "uvicorn>=0.23.0",
    "matplotlib>=3.10.5",
    "tld>=0.13.1",
    "yalexs>=8.0.0",
    "aiohttp>=3.14.3",
    "gpxpy>=1.5.0",
    "paramiko>=5.0.0",
    # RSA + AES for the Deco local admin API handshake (NetworkCheck/deco_client.py).
    # Present transitively via paramiko, but deptry rightly flags transitive use.
    "cryptography>=43.0.0",
    "libpyfoscam>=1.2.2",
    "requests-oauthlib>=2.0.0",
    "websocket-client>=1.0.0",
    "samsungtvws @ git+https://github.com/NickWaterton/samsung-tv-ws-api.git",
    "pillow>=12.3.0",
    "pillow-heif>=0.22.0",
    "omegaconf>=2.3.0",
    "tesla-fleet-api>=1.4.7",
    "ring-doorbell>=0.9.0",
    "pyeconet>=0.2.2",
]

[project.optional-dependencies]
iot = [
]
streamlit = [
    "streamlit>=1.0.0",
]
voice = [
    "pywhispercpp>=1.2.0",
    "sounddevice>=0.5.0",
    "webrtcvad-wheels>=2.0.14",
    "rumps>=0.4.0",
    "pynput>=1.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lib", "Tesla", "BimpopAI", "August", "RingSecurity", "RingBeams", "Rheem"]

[tool.uv]
# Dependency cooldown: ignore releases published in the last 7 days when
# resolving, so a compromised or broken fresh upload cannot land here the day it
# ships. This is a moving window applied at LOCK time only -- installs follow the
# committed uv.lock, so CI stays reproducible and this never shifts under a build.
# Relative durations need uv >= 0.9.17.
# https://docs.astral.sh/uv/concepts/resolution/#dependency-cooldowns
#
# KEEP THIS KEY ABOVE constraint-dependencies. TOML key order is meaningless to
# uv, but semgrep's uv-missing-dependency-cooldown rule anchors on
# constraint-dependencies and only sees keys declared before it -- move this
# below and the rule reports the cooldown as missing even though it is set.
exclude-newer = "7 days"
# semgrep exact-pins mcp; older semgrep pulls opentelemetry ~=1.25 -> protobuf <5,
# which breaks tesla-fleet-api's gencode/runtime check. Floor protobuf so the
# resolver cannot backtrack into that corner. See PR #241, #249.
constraint-dependencies = ["protobuf>=6.31.1"]

[tool.deptry]
known_first_party = [
    "lib",  # Add lib as first-party module
    "Mailer",
    "MyPushover",
    "MyTwilio",
    "NetHelpers",
    "FoscamImager",
    "TFOneShot",
    "EmailMyIP",
    # Project-specific modules
    "rachio_client",
    "flume_client",
    "data_storage",
    "collector",
    "reporter",
    "logger",
    "PumpReport",
    "PumpStatsWriter",
    "TuyaLogParser",
    "utils",  # for Bimpop.ai/fe/utils.py
    "pr_review",  # scripts/pr_review.py — CI helper imported by its colocated test
]
# Tests are co-located beside sources (Tesla/test_manage_power.py), not in a
# tests/ dir, so the bare "tests" entry never matched anything. Exclude the real
# layout instead: test files legitimately import dev-scoped deps like pytest, and
# leaving DEP004 active elsewhere still catches pytest leaking into production code.
exclude = [
    "tests",
    ".venv",
    "backups",
    "test_.*\\.py",
    ".*/test_.*\\.py",
    "conftest\\.py",
    ".*/conftest\\.py",
]

[tool.deptry.package_module_name_map]
streamlit = "streamlit"
# webrtcvad-wheels is a maintained fork that ships as `import webrtcvad`
webrtcvad-wheels = "webrtcvad"
# Ignore missing dependencies that are optional or environment-specific
[tool.deptry.per_rule_ignores]
DEP001 = [
    "pywhispercpp",
    "sounddevice",
    "webrtcvad",
    "rumps",
    "pynput",
    "PyObjCTools",  # transitive via rumps, only present with --extra voice
    "aiy",
    "google",
    "google_auth_oauthlib",
    "pinecone",
    "langchain_pinecone",
    "tld",
    "tensorflow",
    "keras",
    "tesla_api",
    "tesla_powerwall",
    "matplotlib",
    "twilio",
    "cv2",
    "__main__"  # Built-in module used in logger.py
]
DEP002 = [
    # VoiceNotes optional deps — lazy-imported at runtime (not visible to deptry static scan)
    "pywhispercpp",
    "sounddevice",
    "webrtcvad-wheels",
    "rumps",
    "pynput",
    # Dev tools that aren't imported directly
    "pytest-cov",
    "pytest-asyncio", 
    "pytest-mock",
    "pytest-forked",
    "ruff",
    "flake8",
    "mypy",
    "vulture",
    "semgrep",
    "codespell",
    "deptry",
    # Type stubs for mypy (not directly imported)
    "types-requests",
    "types-paramiko", 
    "pandas-stubs",
    # Dependencies that may be used indirectly or for future use
    "requests-oauthlib",
    "websocket",
    "websocket-client",
]
DEP003 = ["google", "streamlit", "BimpopAI", "PyObjCTools"]  # PyObjCTools comes via rumps → pyobjc

[tool.codespell]
# doubleclick.net is a real ad domain (NoShorts docs) — not a typo.
ignore-words-list = "doubleclick"

[tool.pytest.ini_options]
testpaths = ["Tesla", "RachioFlume", "August", "SamsungFrame", "VoiceNotes", "RingSecurity", "RingBeams", "Rheem", "AppleNotesBackup", "NetworkCheck", "lib", "scripts"]
addopts = "-v --tb=short"
asyncio_mode = "auto"


[tool.ruff]
line-length = 100
exclude = [
    ".git",
    ".venv", 
    "__pycache__",
]

[tool.ruff.lint.per-file-ignores]
"*/test_*.py" = ["E402"]  # Allow imports after mocks in test files
"GarageCheck/transferlearn_on_imagenet.py" = ["E402"]  # Jupyter notebook style

[tool.mypy]
python_version = "3.13"
# scripts/ is a flat directory of standalone CI helpers, not a package;
# put it on the path so its colocated tests can import them by module name.
mypy_path = "scripts"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
namespace_packages = true
explicit_package_bases = true
exclude = [
]

[[tool.mypy.overrides]]
module = [
    "pywhispercpp.*",
    "sounddevice.*",
    "webrtcvad.*",
    "rumps.*",
    "pynput.*",
    "yalexs.*",
    "pyeconet.*",
    "twilio.*",
    "webview.*",
    "selenium.*",
    "geopy.*",
    "tensorflow.*",
    "keras.*",
    "aiy.*",
    "google.*",
    "google_auth_oauthlib.*",
    "websocket.*",
    "urlparse.*",
    "PumpReport.*",
    "PumpStatsWriter.*",
    "TuyaLogParser.*",
    "tesla_api.*",
    "pinecone.*",
    "langchain_pinecone.*",
    "cv2.*",
    "collector.*",
    "reporter.*",
    "utils.*",
    "streamlit.*",
    "pillow_heif.*",
    "tqdm.*",
]
ignore_missing_imports = true

# Less strict checking for remaining legacy modules
[[tool.mypy.overrides]]
module = [
    "VoiceNotes.*",
    "lib.*",
    "GPXParser.*",
    # Modules with remaining complex type issues (clean baseline)
    "BimpopAI.aiy_hat.aiy_runner",
    "BimpopAI.aiy_hat.auth_helpers", 
    "BimpopAI.app.utils",
    "BrowserAlert.alert_me",
    "GarageCheck.TFOneShot",
    "Tesla.manage_power",
    "Tesla.tesla_async_apis",
    "Tesla.test_manage_power",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
warn_return_any = false
warn_unreachable = false
ignore_errors = true

# Single source of truth for dev tooling. uv installs this group by default,
# so `uv sync` is all any call site needs -- there is no `dev` extra to request.
[dependency-groups]
dev = [
    # Test runner + plugins
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-forked>=1.6.0",
    # Linters / analysers
    "ruff>=0.13.0",
    "flake8>=5.0.0",
    "mypy>=1.17.1",
    "vulture>=2.0.0",
    "semgrep>=1.174.0",
    "codespell>=2.0.0",
    "deptry>=0.23.1",
    # Type stubs
    "types-requests>=2.32.4.20250913",
    "types-paramiko>=3.4.0",
    "pandas-stubs>=2.3.2.250926",
]


